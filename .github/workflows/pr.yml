name: CI-PR
on:
  push: null
jobs:
  clang-format:
    runs-on: ubuntu-22.04
    steps:
    - name: stepify-probe-clang-format
      run: echo stepify-probe-clang-format
    - uses: actions/checkout@v4
    - name: clang-format
      run: 'docker run --rm -v ${PWD}:/src ghcr.io/wiiu-env/clang-format:13.0.0-2 -r ./source --exclude
        ./source/elfio --exclude ./source/utils/json.hpp

        '
    - name: stepify-tail-clang-format
      run: echo stepify-tail-clang-format
  check-build-with-logging:
    runs-on: ubuntu-22.04
    needs: clang-format
    steps:
    - name: stepify-probe-check-build-with-logging
      run: echo stepify-probe-check-build-with-logging
    - uses: actions/checkout@v4
    - name: build binary with logging
      run: 'docker build . -t builder

        docker run --rm -v ${PWD}:/project builder make DEBUG=VERBOSE

        docker run --rm -v ${PWD}:/project builder make clean

        docker run --rm -v ${PWD}:/project builder make DEBUG=1

        '
    - name: stepify-tail-check-build-with-logging
      run: echo stepify-tail-check-build-with-logging
  build-binary:
    runs-on: ubuntu-22.04
    needs: clang-format
    steps:
    - name: stepify-probe-build-binary
      run: echo stepify-probe-build-binary
    - name: stepify-fault-build-binary
      run: exit 1
    - uses: actions/checkout@v4
    - name: create version.h
      run: 'git_hash=$(git rev-parse --short "${{ github.event.pull_request.head.sha }}")

        cat <<EOF > ./source/version.h

        #pragma once

        #define MODULE_VERSION_EXTRA " (nightly-$git_hash)"

        EOF

        '
    - name: build binary
      run: 'docker build . -t builder

        docker run --rm -v ${PWD}:/project builder make

        '
    - uses: actions/upload-artifact@master
      with:
        name: binary
        path: '*.wms'
    - name: stepify-tail-build-binary
      run: echo stepify-tail-build-binary
